name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{
              "host":"clubplan3r-ai.github.io",
              "key":"9f4c2a7e6b1d8c503a9e7f2b6d4c1a85",
              "keyLocation":"https://clubplan3r-ai.github.io/safari-minds-village/9f4c2a7e6b1d8c503a9e7f2b6d4c1a85.txt",
              "urlList":[
                "https://clubplan3r-ai.github.io/safari-minds-village/",
                "https://clubplan3r-ai.github.io/safari-minds-village/activities/",
                "https://clubplan3r-ai.github.io/safari-minds-village/program/",
                "https://clubplan3r-ai.github.io/safari-minds-village/partners/",
                "https://clubplan3r-ai.github.io/safari-minds-village/contact/"
              ]
            }'